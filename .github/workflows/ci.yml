name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Preserve resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: error

  feature-build:
    name: Features (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux audio development headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Check all optional backends
        run: cargo check --workspace --all-targets --features realtime-audio,midi,terminal-ui
      - name: Test all optional backends
        run: cargo test --workspace --all-targets --features realtime-audio,midi,terminal-ui
      - name: Clippy all optional backends
        run: cargo clippy --workspace --all-targets --features realtime-audio,midi,terminal-ui -- -D warnings
      - name: Build optimized runtime
        run: cargo build --release --features realtime-audio,midi,terminal-ui
      - name: Build CLAP plugin
        run: cargo build --release -p shelloop-clap

  vst3-build:
    name: VST3 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and verify VST3 plugin
        run: python scripts/build_vst3.py vst3-out
      - uses: actions/upload-artifact@v4
        with:
          name: vst3-${{ matrix.os }}
          path: vst3-out
          if-no-files-found: error
