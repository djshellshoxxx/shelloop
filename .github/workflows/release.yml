name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (for example v1.1.0-rc.1)"
        required: true
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: true

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest
          # macos-latest is Apple silicon (arm64); macos-15-intel is x86_64.
          - name: macos-arm64
            os: macos-latest
          - name: macos-x86_64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux audio development headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Test release source
        run: cargo test --workspace --all-targets --features realtime-audio,midi,terminal-ui
      - name: Build standalone application
        run: cargo build --release --features realtime-audio,midi,terminal-ui
      - name: Build CLAP plugin
        run: cargo build --release -p shelloop-clap
      - name: Build VST3 plugin
        run: ${{ runner.os == 'macOS' && 'python3' || 'python' }} scripts/build_vst3.py vst3-out
      - name: Package Linux artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          app="shelloop-${TAG}-linux-x86_64"
          clap="shelloop-clap-${TAG}-linux-x86_64"
          vst3="shelloop-vst3-${TAG}-linux-x86_64"
          mkdir -p "dist/$app" "dist/$clap" "dist/$vst3"
          cp target/release/shelloop "dist/$app/"
          cp target/release/libshelloop_clap.so "dist/$app/shelloop.clap"
          cp README.md LICENSE COPYRIGHT-TRADEMARK.md "dist/$app/"
          cp -r patterns projects "dist/$app/"
          cp target/release/libshelloop_clap.so "dist/$clap/shelloop.clap"
          cp clap-plugin/README.md LICENSE "dist/$clap/"
          cp -r vst3-out/SHELLOOP.vst3 "dist/$vst3/"
          cp vst3/README.md LICENSE "dist/$vst3/"
          tar -C dist -czf "dist/$app.tar.gz" "$app"
          tar -C dist -czf "dist/$clap.tar.gz" "$clap"
          tar -C dist -czf "dist/$vst3.tar.gz" "$vst3"
          cd dist
          for file in "$app.tar.gz" "$clap.tar.gz" "$vst3.tar.gz"; do sha256sum "$file" > "$file.sha256"; done
          echo "APP_ARCHIVE=dist/$app.tar.gz" >> "$GITHUB_ENV"
      - name: Package macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        env:
          PLATFORM: ${{ matrix.name }}
        run: |
          set -euo pipefail
          # Keep tar from writing AppleDouble (._*) entries for extended attributes.
          export COPYFILE_DISABLE=1
          app="shelloop-${TAG}-${PLATFORM}"
          clap="shelloop-clap-${TAG}-${PLATFORM}"
          vst3="shelloop-vst3-${TAG}-${PLATFORM}"
          # make_clap_bundle DEST_DIR: wrap libshelloop_clap.dylib as shelloop.clap
          # (a .clap bundle with Info.plist) and apply an ad-hoc signature.
          make_clap_bundle() {
            local bundle="$1/shelloop.clap"
            mkdir -p "$bundle/Contents/MacOS"
            cp target/release/libshelloop_clap.dylib "$bundle/Contents/MacOS/shelloop"
            cat > "$bundle/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>SHELLOOP</string>
            <key>CFBundleExecutable</key><string>shelloop</string>
            <key>CFBundleIdentifier</key><string>com.circuitdriftlabs.shelloop.clap</string>
            <key>CFBundlePackageType</key><string>BNDL</string>
            <key>CFBundleVersion</key><string>1.1.0</string>
            <key>CFBundleShortVersionString</key><string>1.1.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict>
          </plist>
          PLIST
            codesign --force --sign - "$bundle"
          }
          mkdir -p "dist/$app" "dist/$clap" "dist/$vst3"
          cp target/release/shelloop "dist/$app/"
          codesign --force --sign - "dist/$app/shelloop"
          cp README.md LICENSE COPYRIGHT-TRADEMARK.md "dist/$app/"
          cp -r patterns projects "dist/$app/"
          make_clap_bundle "dist/$app"
          make_clap_bundle "dist/$clap"
          cp clap-plugin/README.md LICENSE "dist/$clap/"
          cp -r vst3-out/SHELLOOP.vst3 "dist/$vst3/"
          cp vst3/README.md LICENSE "dist/$vst3/"
          tar -C dist -czf "dist/$app.tar.gz" "$app"
          tar -C dist -czf "dist/$clap.tar.gz" "$clap"
          tar -C dist -czf "dist/$vst3.tar.gz" "$vst3"
          cd dist
          for file in "$app.tar.gz" "$clap.tar.gz" "$vst3.tar.gz"; do shasum -a 256 "$file" > "$file.sha256"; done
          echo "APP_ARCHIVE=dist/$app.tar.gz" >> "$GITHUB_ENV"
      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG
          $app = "shelloop-$tag-windows-x86_64"
          $clap = "shelloop-clap-$tag-windows-x86_64"
          $vst3 = "shelloop-vst3-$tag-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$app", "dist/$clap", "dist/$vst3" | Out-Null
          Copy-Item 'target/release/shelloop.exe' "dist/$app"
          Copy-Item 'target/release/shelloop_clap.dll' "dist/$app/shelloop.clap"
          Copy-Item 'README.md', 'LICENSE', 'COPYRIGHT-TRADEMARK.md' "dist/$app"
          Copy-Item 'patterns', 'projects' "dist/$app" -Recurse
          Copy-Item 'target/release/shelloop_clap.dll' "dist/$clap/shelloop.clap"
          Copy-Item 'clap-plugin/README.md', 'LICENSE' "dist/$clap"
          Copy-Item 'vst3-out/SHELLOOP.vst3' "dist/$vst3"
          Copy-Item 'vst3/README.md', 'LICENSE' "dist/$vst3"
          Copy-Item 'target/release/shelloop.exe' "dist/shelloop-$tag-windows-x86_64.exe"
          Compress-Archive -Path "dist/$app/*" -DestinationPath "dist/$app.zip" -Force
          Compress-Archive -Path "dist/$clap/*" -DestinationPath "dist/$clap.zip" -Force
          Compress-Archive -Path "dist/$vst3/*" -DestinationPath "dist/$vst3.zip" -Force
          foreach ($file in @("$app.zip", "$clap.zip", "$vst3.zip", "shelloop-$tag-windows-x86_64.exe")) {
            $hash = (Get-FileHash "dist/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file" | Set-Content -NoNewline "dist/$file.sha256"
          }
          "APP_ARCHIVE=dist/$app.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify packaged application
        run: ${{ runner.os == 'macOS' && 'python3' || 'python' }} scripts/verify_release.py ${{ env.APP_ARCHIVE }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish ${{ env.TAG }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: SHELLOOP ${{ env.TAG }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            SHELLOOP terminal step sequencer, synthesizer and performance workstation.

            Downloads:
            - **Windows standalone**: `shelloop-${{ env.TAG }}-windows-x86_64.exe` (single executable), or the `.zip` bundle with example projects and the CLAP plugin.
            - **Linux standalone**: `shelloop-${{ env.TAG }}-linux-x86_64.tar.gz` (binary, example projects, CLAP plugin).
            - **macOS standalone**: `shelloop-${{ env.TAG }}-macos-arm64.tar.gz` (Apple silicon) or `shelloop-${{ env.TAG }}-macos-x86_64.tar.gz` (Intel). Builds are ad-hoc signed, not notarized; see the README for `xattr -dr com.apple.quarantine`.
            - **CLAP plugin**: `shelloop-clap-${{ env.TAG }}-<platform>` contains `shelloop.clap` for DAWs that load CLAP instruments (a bundle directory on macOS).
            - **VST3 plugin**: `shelloop-vst3-${{ env.TAG }}-<platform>` contains `SHELLOOP.vst3` (the same instrument wrapped for VST3 hosts). Copy it to `~/.vst3/` on Linux, `~/Library/Audio/Plug-Ins/VST3/` on macOS, or `C:\Program Files\Common Files\VST3\` on Windows and rescan.

            Verify each download against its `.sha256` file. Builds come from CI; physical audio-hardware latency validation is reported separately (see docs/HARDWARE-ACCEPTANCE.md).
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.sha256
